services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swarmfront_scholastic
      POSTGRES_PASSWORD: swarmfront_scholastic
      POSTGRES_DB: swarmfront_scholastic
    ports:
      - "5434:5432"
    volumes:
      - scholastic_postgres_data:/var/lib/postgresql/data

volumes:
  scholastic_postgres_data:

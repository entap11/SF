name: Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      matrix_gate:
        description: Player config matrix tier
        required: true
        default: fast
        type: choice
        options:
          - fast
          - pr
          - nightly
      matrix_seed:
        description: Base deterministic seed
        required: true
        default: "123"
      matrix_seed_runs:
        description: Optional override for matrix soak seed runs
        required: false
        default: ""
      matrix_no_soak:
        description: Run matrix contract and boot routes only
        required: false
        default: false
        type: boolean
      include_soak_gate:
        description: Include legacy perf soak gate
        required: false
        default: false
        type: boolean
      include_tf_preflight:
        description: Include TestFlight machine/backend preflight
        required: false
        default: false
        type: boolean
      perf_harness_recertify:
        description: Run Harness V1 focused gates and baseline recertification
        required: false
        default: false
        type: boolean
      perf_harness_diagnose:
        description: Capture one isolated Harness V1 windowed pacing diagnostic
        required: false
        default: false
        type: boolean
      perf_harness_diagnostic_variant:
        description: Isolated Harness V1 diagnostic variant
        required: false
        default: default_awake_minimal
        type: choice
        options:
          - default_awake_minimal
          - default_awake_repeat_minimal
          - foreground_awake_minimal
          - launchservices_foreground_awake_minimal
          - default_awake_full
          - vsync_disabled_full
          - post_load_awake_minimal
  schedule:
    - cron: "17 11 * * *"

jobs:
  release-readiness:
    name: Release Readiness
    if: ${{ !inputs.perf_harness_recertify && !inputs.perf_harness_diagnose }}
    runs-on: [self-hosted, macOS, godot]
    timeout-minutes: 150
    env:
      GODOT_BIN: ${{ vars.GODOT_BIN || 'godot' }}
      INPUT_MATRIX_GATE: ${{ inputs.matrix_gate || '' }}
      INPUT_MATRIX_SEED: ${{ inputs.matrix_seed || '' }}
      INPUT_MATRIX_SEED_RUNS: ${{ inputs.matrix_seed_runs || '' }}
      INPUT_MATRIX_NO_SOAK: ${{ inputs.matrix_no_soak || false }}
      INPUT_INCLUDE_SOAK_GATE: ${{ inputs.include_soak_gate || false }}
      INPUT_INCLUDE_TF_PREFLIGHT: ${{ inputs.include_tf_preflight || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --version

      - name: Import Godot resources
        run: |
          set -euo pipefail
          import_log="${RUNNER_TEMP}/godot-import.log"
          set +e
          "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" --import 2>&1 | tee "${import_log}"
          import_rc=${PIPESTATUS[0]}
          set -e

          # Godot 4.2 can return non-zero for known shader diagnostics after it
          # has successfully populated the import cache. Require the cache and
          # the boot-critical imports instead of accepting a missing cache.
          required_imports=(
            "assets/fonts/brand/Iceland/Iceland-Regular.ttf.import"
            "assets/sprites/sf_skin_v1/barracks.PNG.import"
            "assets/sprites/sf_skin_v1/mm_back_art.png.import"
          )
          for required_import in "${required_imports[@]}"; do
            if [[ ! -f "${required_import}" ]]; then
              echo "GODOT_IMPORT_FAIL missing=${required_import} import_rc=${import_rc}"
              exit 1
            fi
          done
          echo "GODOT_IMPORT_READY import_rc=${import_rc}"

      - name: Run Release Readiness
        run: |
          set -euo pipefail

          matrix_gate="fast"
          matrix_seed="123"
          matrix_seed_runs=""
          matrix_no_soak="0"
          include_soak_gate="0"
          include_tf_preflight="0"

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            matrix_gate="nightly"
            include_soak_gate="1"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            matrix_gate="${INPUT_MATRIX_GATE:-fast}"
            matrix_seed="${INPUT_MATRIX_SEED:-123}"
            matrix_seed_runs="${INPUT_MATRIX_SEED_RUNS:-}"
            if [[ "${INPUT_MATRIX_NO_SOAK}" == "true" ]]; then
              matrix_no_soak="1"
            fi
            if [[ "${INPUT_INCLUDE_SOAK_GATE}" == "true" ]]; then
              include_soak_gate="1"
            fi
            if [[ "${INPUT_INCLUDE_TF_PREFLIGHT}" == "true" ]]; then
              include_tf_preflight="1"
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            matrix_gate="pr"
          fi

          args=(--matrix-gate "${matrix_gate}" --matrix-seed "${matrix_seed}")
          if [[ -n "${matrix_seed_runs}" ]]; then
            args+=(--matrix-seed-runs "${matrix_seed_runs}")
          fi
          if [[ "${matrix_no_soak}" == "1" ]]; then
            args+=(--matrix-no-soak)
          fi
          if [[ "${include_soak_gate}" == "1" ]]; then
            args+=(--include-soak-gate)
          fi
          if [[ "${include_tf_preflight}" == "1" ]]; then
            args+=(--include-tf-preflight)
          fi

          scripts/dev/run_release_readiness_gate.sh "${args[@]}"

      - name: Collect Smoke Logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci_logs
          if [[ -f /tmp/swarmfront_mvp_smoke.log ]]; then
            cp /tmp/swarmfront_mvp_smoke.log artifacts/ci_logs/swarmfront_mvp_smoke.log
          fi
          if [[ -f /tmp/swarmfront_soak.log ]]; then
            cp /tmp/swarmfront_soak.log artifacts/ci_logs/swarmfront_soak.log
          fi

      - name: Upload Matrix Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-config-matrix-${{ github.run_id }}
          path: |
            artifacts/player_config_matrix/**/*.json
            artifacts/player_config_matrix/logs/*.log
          if-no-files-found: ignore

      - name: Upload Smoke Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}
          path: |
            artifacts/ci_logs/*.log
          if-no-files-found: ignore

  perf-harness-recertification:
    name: Performance Harness V1 Recertification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.perf_harness_recertify && !inputs.perf_harness_diagnose }}
    runs-on: [self-hosted, macOS, godot]
    timeout-minutes: 150
    env:
      GODOT_BIN: ${{ vars.GODOT_BIN || 'godot' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify compatible runner
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --version
          machine_arch="$(uname -m)"
          if [[ "${machine_arch}" != "arm64" ]]; then
            echo "PERF_RECERT_FAIL expected_arch=arm64 actual_arch=${machine_arch}"
            exit 1
          fi

      - name: Import Godot resources
        run: |
          set -euo pipefail
          import_log="${RUNNER_TEMP}/godot-perf-import.log"
          set +e
          "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" --import 2>&1 | tee "${import_log}"
          import_rc=${PIPESTATUS[0]}
          set -e
          required_imports=(
            "assets/fonts/brand/Iceland/Iceland-Regular.ttf.import"
            "assets/sprites/sf_skin_v1/barracks.PNG.import"
            "assets/sprites/sf_skin_v1/mm_back_art.png.import"
          )
          for required_import in "${required_imports[@]}"; do
            if [[ ! -f "${required_import}" ]]; then
              echo "PERF_RECERT_IMPORT_FAIL missing=${required_import} import_rc=${import_rc}"
              exit 1
            fi
          done
          echo "PERF_RECERT_IMPORT_READY import_rc=${import_rc}"

      - name: Run all focused harness gates
        run: |
          set -euo pipefail
          gates=(
            tools/perf_gate_a_smoke_test.gd
            tools/perf_gate_b_smoke_test.gd
            tools/perf_gate_c_smoke_test.gd
            tools/perf_gate_d_smoke_test.gd
            tools/perf_gate_e_smoke_test.gd
            tools/perf_gate_f_smoke_test.gd
            tools/perf_phase1_gate_a_smoke_test.gd
            tools/perf_phase1_gate_b_smoke_test.gd
            tools/perf_phase1_gate_c_smoke_test.gd
            tools/perf_phase1_gate_d_smoke_test.gd
            tools/perf_phase1_gate_e_smoke_test.gd
            tools/perf_phase1_gate_f_smoke_test.gd
            tools/perf_phase2_gate_a_smoke_test.gd
            tools/perf_phase2_gate_b_smoke_test.gd
            tools/perf_phase2_gate_c_smoke_test.gd
            tools/perf_phase2_gate_d_smoke_test.gd
            tools/perf_phase2_gate_e_smoke_test.gd
            tools/perf_phase2_gate_f_smoke_test.gd
            tools/perf_phase2_gate_g_smoke_test.gd
          )
          for gate in "${gates[@]}"; do
            "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" --script "res://${gate}"
          done

      - name: Capture clean baseline candidates
        run: |
          set -euo pipefail
          candidate_dir="artifacts/perf_harness_recert/candidates"
          mkdir -p "${candidate_dir}"
          harness="res://scripts/tests/perf_benchmark_suite.gd"
          common=(--sf-perf-harness --collection-level=MINIMAL)

          "${GODOT_BIN}" --path "${GITHUB_WORKSPACE}" --script "${harness}" -- \
            "${common[@]}" --perf-user-dir=SwarmfrontPerfRecertStatic \
            --suite=phase1_static_fixtures --mode=static_windowed_deterministic \
            --output=res://${candidate_dir}/static_fixtures_windowed.json

          "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" --script "${harness}" -- \
            "${common[@]}" --perf-user-dir=SwarmfrontPerfRecertCanonical \
            --suite=phase1_normal_match --mode=canonical_sim_headless \
            --output=res://${candidate_dir}/normal_match_canonical.json

          "${GODOT_BIN}" --path "${GITHUB_WORKSPACE}" --script "${harness}" -- \
            "${common[@]}" --perf-user-dir=SwarmfrontPerfRecertNormalWindowed \
            --suite=phase1_normal_match --mode=deterministic_windowed_presentation \
            --output=res://${candidate_dir}/normal_match_windowed.json

          "${GODOT_BIN}" --path "${GITHUB_WORKSPACE}" --script "${harness}" -- \
            "${common[@]}" --perf-user-dir=SwarmfrontPerfRecertUnitScale \
            --suite=phase1_unit_scale --mode=static_windowed_deterministic \
            --output=res://${candidate_dir}/unit_scale_windowed.json

      - name: Package and self-compare candidates
        run: |
          set -euo pipefail
          candidate_dir="res://artifacts/perf_harness_recert/candidates"
          package_dir="res://artifacts/perf_harness_recert/harness_v1"
          "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" \
            --script res://scripts/tools/perf_phase1_baseline_package.gd -- \
            --approve-phase1-baselines \
            --output-dir="${package_dir}" \
            --static="${candidate_dir}/static_fixtures_windowed.json" \
            --normal-canonical="${candidate_dir}/normal_match_canonical.json" \
            --normal-windowed="${candidate_dir}/normal_match_windowed.json" \
            --unit-scale="${candidate_dir}/unit_scale_windowed.json"

          reports=(
            static_fixtures_windowed.json
            normal_match_canonical.json
            normal_match_windowed.json
            unit_scale_windowed.json
          )
          for report in "${reports[@]}"; do
            "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" \
              --script res://scripts/tools/perf_compare.gd -- \
              "${package_dir}/${report}" "${package_dir}/${report}"
          done

      - name: Upload recertification package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-harness-v1-recert-${{ github.run_id }}
          path: artifacts/perf_harness_recert/
          if-no-files-found: error

  perf-harness-pacing-diagnostic:
    name: Performance Harness V1 Pacing Diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.perf_harness_diagnose && !inputs.perf_harness_recertify }}
    runs-on: [self-hosted, macOS, godot]
    timeout-minutes: 60
    env:
      GODOT_BIN: ${{ vars.GODOT_BIN || 'godot' }}
      PERF_PACING_DIAGNOSTIC_VARIANT: ${{ inputs.perf_harness_diagnostic_variant || 'default_awake_minimal' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify diagnostic runner
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --version
          command -v jq
          command -v open
          command -v perl
          command -v pgrep
          machine_arch="$(uname -m)"
          if [[ "${machine_arch}" != "arm64" ]]; then
            echo "PERF_PACING_DIAGNOSTIC_FAIL expected_arch=arm64 actual_arch=${machine_arch}"
            exit 1
          fi

      - name: Import Godot resources
        run: |
          set -euo pipefail
          import_log="${RUNNER_TEMP}/godot-perf-diagnostic-import.log"
          set +e
          "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" --import 2>&1 | tee "${import_log}"
          import_rc=${PIPESTATUS[0]}
          set -e
          required_imports=(
            "assets/fonts/brand/Iceland/Iceland-Regular.ttf.import"
            "assets/sprites/sf_skin_v1/barracks.PNG.import"
            "assets/sprites/sf_skin_v1/mm_back_art.png.import"
          )
          for required_import in "${required_imports[@]}"; do
            if [[ ! -f "${required_import}" ]]; then
              echo "PERF_PACING_DIAGNOSTIC_IMPORT_FAIL missing=${required_import} import_rc=${import_rc}"
              exit 1
            fi
          done
          echo "PERF_PACING_DIAGNOSTIC_IMPORT_READY import_rc=${import_rc}"

      - name: Verify diagnostic isolation
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" \
            --script res://tools/app_lifecycle_smoke_test.gd
          "${GODOT_BIN}" --headless --path "${GITHUB_WORKSPACE}" \
            --script res://tools/perf_interrupted_cleanup_smoke_test.gd

      - name: Capture isolated pacing variant
        run: |
          set -euo pipefail
          command -v caffeinate
          caffeinate -u -t 5
          PERF_PACING_DISPLAY_PRECONDITION=WAKE_AND_HOLD \
            caffeinate -dis scripts/dev/run_perf_harness_pacing_diagnostic.sh

      - name: Upload pacing diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-harness-pacing-diagnostic-${{ github.run_id }}
          path: artifacts/perf_harness_pacing_diagnostic/
          if-no-files-found: error

services:
  - type: web
    name: entap-identity-rank-staging
    runtime: node
    rootDir: tools/rank-service
    plan: starter
    region: oregon
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: entap-identity-rank-staging-db
          property: connectionString
      - key: BIND_HOST
        value: 0.0.0.0
      - key: RANK_API_TOKEN
        sync: false
      - key: RANK_ENFORCE_CANONICAL_PLAYER_IDS
        value: "true"
      - key: RANK_ENABLE_DEBUG_ACTIONS
        value: "false"
      - key: RANK_ECONOMY_MUTATIONS_ENABLED
        value: "false"
      - key: RANK_ECONOMY_RESET_ENABLED
        value: "false"
      - key: RANK_ECONOMY_EPOCH
        value: beta_launch_0001
      - key: RANK_VERIFIED_MATCH_MUTATIONS_ENABLED
        value: "false"
      - key: RANK_PUBLIC_LEADERBOARDS_ENABLED
        value: "false"
      - key: RANK_DEFAULT_REGION
        value: GLOBAL
      - key: ENTAP_PLAYER_TOKEN_ISSUER
        value: entap-identity
      - key: ENTAP_PLAYER_TOKEN_AUDIENCE
        value: swarmfront-vs
      - key: ENTAP_PLAYER_TOKEN_KEY_ID
        value: entap-player-v1
      - key: ENTAP_PLAYER_TOKEN_PRIVATE_KEY_PEM
        sync: false
      - key: ENTAP_PLAYER_TOKEN_PUBLIC_KEY_PEM
        sync: false
      - key: ENTAP_PLAYER_TOKEN_TTL_SEC
        value: "600"
      - key: ENTAP_DEVICE_CHALLENGE_TTL_SEC
        value: "300"
      - key: RANK_SERVICE_TOKEN_ISSUER
        value: swarmfront-vs
      - key: RANK_SERVICE_TOKEN_AUDIENCE
        value: swarmfront-rank
      - key: RANK_SERVICE_TOKEN_SUBJECT
        value: vs-settlement-worker
      - key: RANK_SERVICE_TOKEN_KEY_ID
        value: vs-rank-service-v1
      - key: RANK_SERVICE_TOKEN_PUBLIC_KEY_PEM
        sync: false
      - key: RANK_VERIFIER_KEY_ID
        sync: false
      - key: RANK_VERIFIER_PUBLIC_KEY_PEM
        sync: false
      - key: RANK_VERIFIER_WORKER_BUILD_ID
        sync: false

databases:
  - name: entap-identity-rank-staging-db
    databaseName: entap_identity_rank_staging
    user: entap_identity_rank_staging
    region: oregon
    plan: basic-256mb

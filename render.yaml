services:
  - type: web
    name: entap-identity-rank-staging
    runtime: node
    rootDir: tools/rank-service
    plan: starter
    region: oregon
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: entap-identity-rank-staging-db
          property: connectionString
      - key: BIND_HOST
        value: 0.0.0.0
      - key: RANK_API_TOKEN
        sync: false
      - key: RANK_ENFORCE_CANONICAL_PLAYER_IDS
        value: "true"
      - key: RANK_ENABLE_DEBUG_ACTIONS
        value: "false"
      - key: RANK_DEFAULT_REGION
        value: GLOBAL

databases:
  - name: entap-identity-rank-staging-db
    databaseName: entap_identity_rank_staging
    user: entap_identity_rank_staging
    region: oregon
    plan: basic-256mb
